<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Student Management System</h1>

        <h2>Add Student</h2>
    <form id="student-form">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="course" placeholder="Course" required>
        <input type="number" id="age" placeholder="Age" min="1" required>
                <button type="submit" id="submit-button">Add Student</button>
        <button type="button" id="cancel-button" hidden>Cancel</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="student-table-body"></tbody>
    </table>

    <script>
        let editingId = null;

        const form = document.getElementById("student-form");
        const submitButton = document.getElementById("submit-button");
        const cancelButton = document.getElementById("cancel-button");

        async function loadStudents() {
            const response = await fetch("/api/students");
            const students = await response.json();

            const tableBody = document.getElementById("student-table-body");
            tableBody.innerHTML = "";

            students.forEach(student => {
                const row = document.createElement("tr");
                [student.id, student.name, student.email, student.course, student.age].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit-btn";
                editButton.addEventListener("click", () => startEdit(student));
                actionCell.appendChild(editButton);
                

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.addEventListener("click", () => deleteStudent(student.id));
                actionCell.appendChild(deleteButton);

                row.appendChild(actionCell);
                tableBody.appendChild(row);
            });
        }

        function startEdit(student) {
            editingId = student.id;
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("course").value = student.course;
            document.getElementById("age").value = student.age;
            submitButton.textContent = "Update Student";
            cancelButton.hidden = false;
        }

        function resetForm() {
            form.reset();
            editingId = null;
            submitButton.textContent = "Add Student";
            cancelButton.hidden = true;
        }

        async function deleteStudent(id) {
            if (!confirm("Delete this student?")) {
                return;
            }

            await fetch("/api/students/" + id, { method: "DELETE" });
            loadStudents();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                course: document.getElementById("course").value,
                age: parseInt(document.getElementById("age").value)
            };

            if (editingId === null) {
                await fetch("/api/students", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                });
            } else {
                await fetch("/api/students/" + editingId, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                });
            }

            resetForm();
            loadStudents();
        });

        cancelButton.addEventListener("click", resetForm);

        loadStudents();
    </script>
</body>
</html>
